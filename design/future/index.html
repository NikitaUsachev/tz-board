<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТЗ доска · Три направления</title>
<style>
*{box-sizing:border-box}body{--bg:#f6f6f2;--ink:#191c1d;--line:#c6c9c6;--surface:#fff;--hero:#b5dafa;--onhero:#142433;--signal:#ff955f;--onsignal:#262019;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}body[data-theme=contour]{--bg:#141919;--surface:#1c2323;--ink:#edf4f1;--line:#435151;--hero:#212e2e;--onhero:#c3fff1;--signal:#6eeac7;--onsignal:#092820;color-scheme:dark}body[data-theme=time]{--bg:#ece9f4;--surface:#f7f6fb;--ink:#221b38;--line:#bab2cb;--hero:#302148;--onhero:#f2e8ff;--signal:#d4ff84;--onsignal:#202e11}
main{width:min(1140px,100%);margin:auto;padding:24px clamp(16px,4vw,50px) 64px}nav,.tabs,.mast,.schedule,.caption,.entry,.boardrow{display:flex;align-items:center;gap:12px}nav{justify-content:space-between;flex-wrap:wrap;margin-bottom:32px}.tabs{flex-wrap:wrap;gap:4px}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);padding:8px 12px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}:focus-visible{outline:3px solid currentColor;outline-offset:2px}.micro,time,.qty,.counter,.serial{font:12px/1.4 ui-monospace,monospace;letter-spacing:.05em}.mast{justify-content:space-between;border-block:1px solid var(--line);padding:14px 0;flex-wrap:wrap}.brand{font-weight:500}.hero{position:relative;background:var(--hero);color:var(--onhero);padding:clamp(22px,4vw,46px);margin-top:22px}.hero:after{content:"";position:absolute;right:18px;top:18px;width:16px;height:16px;border-right:2px solid;border-top:2px solid}.hero h1{font-size:clamp(38px,7vw,82px);letter-spacing:-.06em;font-weight:300;margin:12px 0 6px;line-height:1}.hero p{margin:10px 0 0}.schedule{flex-wrap:wrap;margin-top:24px}.schedule span{border-left:1px solid;padding-left:10px}.schedule .cue{background:var(--signal);color:var(--onsignal);padding:5px 10px;border:0}.caption{justify-content:space-between;margin:28px 0 8px}.caption h2{font-size:23px;font-weight:400;letter-spacing:-.03em;margin:0}.entry{padding:15px 2px;border-top:1px solid var(--line)}.entry input{width:19px;height:19px;accent-color:var(--ink);flex:none}.entry small{display:block;margin-top:3px;opacity:.78}.qty{margin-left:auto;white-space:nowrap;font-size:15px}.boardrow{background:var(--surface);border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:90px 1fr 1fr auto}.boardrow.active{border-left:6px solid var(--hero)}.boardrow strong{font-weight:500}.status{font-size:13px}.foot{border-top:1px solid var(--line);padding-top:12px;margin-top:26px;font-size:13px}.tech{max-width:780px;margin:auto}.tech .hero{margin-top:16px}[data-theme=contour] .hero{border:1px solid var(--line);border-left:4px solid var(--signal)}[data-theme=contour] .boardrow.active{border-left-color:var(--signal)}[data-theme=time] .boardrow{border-left:2px solid var(--ink)}[data-theme=time] .serial{font-size:24px}[data-theme=time] .schedule time{font-size:19px}
@media(max-width:650px){main{padding-top:14px}nav{margin-bottom:18px}.boardrow{grid-template-columns:60px 1fr;gap:5px 12px}.boardrow .status{grid-column:2}.boardrow .hall{grid-column:2}.mast{gap:8px}.qty{font-size:13px}}
</style>
<main><nav aria-label="Сравнение макетов"><span class="micro">ТЗ ДОСКА / ДИЗАЙН-ЭТЮДЫ</span><div class="tabs" id="themes"><button data-key="light">01 Световой лист</button><button data-key="contour">02 Контур</button><button data-key="time">03 Таймкод</button></div></nav>
<div class="mast"><span class="brand">ТЗ / Мероприятия</span><div class="tabs" id="roles"><button data-key="board">Доска администратора</button><button data-key="tech">Лист техника</button></div></div><p id="editorLink"><a href="editor/" style="color:inherit">Открыть редактор ТЗ · Световой лист ↗</a></p><div id="screen"></div><div class="foot">Демонстрационное ТЗ · Отметки действуют только в этом макете.</div></main>
<script>
const screenEl=document.querySelector('#screen'),tasks=[['Суфлёр','На сцене, перед первым рядом','2 шт.'],['Экран 4,5 × 2,5 м','Собираем на тотемах','1 шт.'],['ТВ 65″ на стойке','Справа от сцены, вход HDMI','1 шт.']],done=[true,false,false];
const times='<div class="schedule"><span>Монтаж <time>09:00</time></span><span class="cue">Прогоны <time>14:30</time></span><span>Старт <time>18:00</time></span></div>';
function render(){
 let [theme,role]=location.hash.slice(1).split('/');if(!['light','contour','time'].includes(theme))theme='light';if(role!=='tech')role='board';
 document.body.dataset.theme=theme;document.querySelector('#editorLink').hidden=theme!=='light';
 for(const [group,key] of [['themes',theme],['roles',role]])document.querySelectorAll('#'+group+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.key===key));
 const tech=role==='tech',scheduleFirst=theme==='time';
 const hero='<header class="hero"><span class="micro">'+(tech?'ТЕХНИЧЕСКОЕ ЗАДАНИЕ / 011':'СРЕДА / 04 НОЯБРЯ 2026')+'</span>'+(scheduleFirst?times:'')+'<h1>'+(tech?'Brook Hall':scheduleFirst?'09:00 — 18:00':'Доска мероприятий')+'</h1><p>'+(tech?'Конференция · 4 ноября':'Монтажная смена · 3 мероприятия')+'</p>'+(!scheduleFirst?times:'')+'</header>';
 const board='<div class="caption"><h2>'+(scheduleFirst?'Расписание смены':'Сегодня на площадке')+'</h2><span class="counter">03 ТЗ</span></div>'+[['09:00','Конференция','Brook Hall','В подготовке'],['10:30','Презентация','Welcome Hall','Утверждено'],['12:00','Репетиция','Main Hall','Черновик']].map(([t,n,h,s],i)=>'<div class="boardrow '+(i===0?'active':'')+'"><time class="serial">'+t+'</time><strong>'+n+'</strong><span class="hall">'+h+'</span>'+(i===0?'<button data-open>Открыть ТЗ ↗</button>':'<span class="status">'+s+'</span>')+'</div>').join('');
 const sheet='<div class="caption"><h2>Видео</h2><span class="counter" id="count"></span></div>'+tasks.map(([n,d,q],i)=>'<label class="entry"><input type="checkbox" data-task="'+i+'" '+(done[i]?'checked':'')+'><span>'+n+'<small>'+d+'</small></span><span class="qty">'+q+'</span></label>').join('');
 screenEl.className=tech?'tech':'';screenEl.innerHTML=hero+(tech?sheet:board);count();
}
function count(){let n=document.querySelector('#count');if(n)n.textContent=done.filter(Boolean).length+' / 3 выполнено'}
function role(){return document.querySelector('#roles [aria-pressed=true]').dataset.key}
document.querySelector('#themes').onclick=e=>{if(e.target.dataset.key)location.hash=e.target.dataset.key+'/'+role()};
document.querySelector('#roles').onclick=e=>{if(e.target.dataset.key)location.hash=document.body.dataset.theme+'/'+e.target.dataset.key};
screenEl.onclick=e=>{if(e.target.closest('[data-open]'))location.hash=document.body.dataset.theme+'/tech'};
screenEl.onchange=e=>{if(e.target.matches('[data-task]')){done[Number(e.target.dataset.task)]=e.target.checked;count()}};
window.addEventListener('hashchange',render);render();
</script></html>
