<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТЗ · Пример улучшений интерфейса</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="light-sheet.css"><link rel="stylesheet" href="preview.css?v=3"><style>.demo-toolbar{padding:12px 18px;background:#171c20;color:#edf2f4;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:14px Helvetica,Arial,sans-serif}.demo-toolbar strong{margin-right:auto}.demo-toolbar a{color:#b5dafa;padding:8px;border:1px solid #49555a;border-radius:4px;text-decoration:none}.demo-toolbar a.active{background:#b5dafa;color:#171c20}.demo-note{margin:0;padding:10px 18px;background:#fff0e5;color:#262019;font:13px Helvetica,Arial,sans-serif}</style>
<div class="demo-toolbar"><strong>Предложение UI/UX · тестовый пример</strong><a id="old">Сейчас</a><a id="new">Предложение</a><a id="role">Режим администратора</a></div><p class="demo-note">Демонстрационные данные. Можно отмечать задачи и редактировать ТЗ — изменения не отправляются в рабочее приложение. Перезагрузка сбрасывает пример.</p><div id="app"></div>
<script>const params=new URLSearchParams(location.search),original=params.get('layout')==='old',admin=params.get('role')==='admin';document.body.classList.toggle('original',original);for(const [id,layout] of [['old','old'],['new','new']]){const p=new URLSearchParams(params);p.set('layout',layout);document.getElementById(id).href='?'+p+'#ev-E';document.getElementById(id).classList.toggle('active',original===(layout==='old'))}const r=new URLSearchParams(params);r.set('role',admin?'tech':'admin');document.getElementById('role').href='?'+r+'#ev-E';document.getElementById('role').textContent=admin?'Режим техника':'Режим администратора';</script><script src="demo.js"></script><script>let script=document.createElement('script');script.src=original?'app-current.js':'app-preview.js';document.body.append(script);</script></html>
