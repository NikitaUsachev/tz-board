<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Пять новых эскизов · ТЗ</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:#202322;font:16px/1.45 system-ui,sans-serif}main,header{max-width:1260px;margin:auto;padding:18px}header{border-bottom:1px solid #aaa}small,.meta,.tag{font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.07em}h1,h2,h3,p{margin:0}header h1{font-size:28px;margin:5px 0 10px}button{cursor:pointer;font:inherit;color:inherit}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;border:1px solid #969996;padding:8px 12px}nav [aria-pressed=true]{color:white;background:#252826}button:focus-visible{outline:3px solid #2374a0;outline-offset:2px}.desc{margin:0 0 18px}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(295px,1fr);gap:18px}.panel{background:var(--p);color:var(--i);padding:clamp(18px,3vw,36px);min-height:390px;border-top:5px solid var(--a)}.label{margin-bottom:7px;font-size:13px}.meta{color:var(--a)}.panel h2{font-size:clamp(28px,4vw,54px);line-height:1.06;letter-spacing:-.045em;margin:24px 0}.panel h3{font-size:22px;line-height:1.15}hr{border:0;border-top:1px solid var(--l);margin:18px 0}.row,.sel,.task{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border:0;border-top:1px solid var(--l);text-align:left;color:inherit;background:transparent}.sel span:last-child{margin-left:auto}.sel[aria-pressed=true]{font-weight:750;color:var(--a)}.num{font:600 22px ui-monospace,monospace}.task input{width:20px;height:20px;accent-color:var(--a)}.confirm{background:var(--i);color:var(--p);padding:12px 18px;border:0;margin-top:12px}.info{margin-top:14px;font-size:14px}.sheet{--p:#faf7f0;--i:#282926;--a:#844337;--l:#b9b2a6}.sheet h2{font-family:Georgia,serif}.spine{--p:#18272a;--i:#eff5ef;--a:#a3d3c1;--l:#526766}.spine .sel{border:0;border-left:3px solid var(--l);padding-left:16px}.spine .sel[aria-pressed=true]{border-color:var(--a)}.spread{--p:#f1f4f7;--i:#192938;--a:#335779;--l:#abb8c2}.split{display:grid;grid-template-columns:minmax(120px,1fr) 1.3fr;gap:18px}.detail{border-left:1px solid var(--l);padding:18px}.signal{--p:#29252c;--i:#f5eff4;--a:#dfb5cf;--l:#766775}.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slot{border-top:3px solid var(--a);padding:12px 0}.slot strong{display:block;font-size:30px}.folio{--p:#f4f2ee;--i:#242628;--a:#4c5951;--l:#acb1a8}.folio .big{font:700 clamp(65px,9vw,110px)/1 system-ui;letter-spacing:-.09em}.tabs{display:flex;flex-wrap:wrap}.tabs .sel{width:auto;padding:9px;border:1px solid var(--l)}.tabs .sel[aria-pressed=true]{background:var(--i);color:var(--p)}@media(max-width:800px){.grid{grid-template-columns:1fr}.panel{min-height:auto}.split{grid-template-columns:1fr}.detail{border:0;padding:6px 0}.grid>div{min-width:0}} 
</style><header><small>ДИЗАЙН ПРИЛОЖЕНИЯ　/　СЕРИЯ 02</small><h1>ТЗ на мероприятия</h1><nav id="nav"></nav></header><main><p class="desc" id="desc"></p><div class="grid"><div><p class="label">Доска администратора · пример мероприятия</p><section class="panel" id="board"></section></div><div><p class="label">Страница техника · интерактивный пример</p><section class="panel" id="tech"></section></div></div></main>
<script>
const names=['Монтажный паспорт','Маршрут бригады','Разворот бюро','Передача смены','Картотека залов'],themes=['sheet','spine','spread','signal','folio'];
const descriptions=['Мероприятие как технический документ. Сначала реквизиты и дата, затем ведомость залов.','Залы как остановки на одной линии. Номер и положение помогают бригаде ориентироваться на площадке.','Залы слева, содержание выбранного зала справа. Быстрое сравнение без перехода между карточками.','Два главных вопроса смены: что ещё выполнить и какие залы уже подтвердили.','Каждый зал — отдельный лист с крупным номером. Корешки сверху позволяют листать залы.'];
const halls=['Welcome Hall','Main Hall','Brook Hall'],roles=['Регистрация','Пленарная сессия','Конференция'],tasks=[['Проверить подсветку стойки','Подключить экран регистрации'],['Проверить микрофоны','Вывести презентацию'],['Проверить суфлёр','Вывести изображение на экран']];
let v=0,h=2,checks=[[true,true],[false,false],[true,false]],ready=[true,false,false];
function status(i){return ready[i]?'Готовность подтверждена':checks[i].every(Boolean)?'Ожидает подтверждения':'В работе'}
function links(){return halls.map((name,i)=>'<button class="sel" aria-pressed="'+(i===h)+'" onclick="choose('+i+')"><b class="num">0'+(i+1)+'</b> '+name+'<span>↗</span></button>').join('')}
function choose(i){h=i;render()}function change(i){checks[h][i]=!checks[h][i];ready[h]=false;render()}function confirmHall(){if(checks[h].every(Boolean))ready[h]=true;render()}function variant(i){v=i;history.replaceState(null,'','#'+(i+1));render()}
function render(){document.body.className=themes[v];nav.innerHTML=names.map((n,i)=>'<button aria-pressed="'+(v===i)+'" onclick="variant('+i+')">'+(i+1)+' · '+n+'</button>').join('');desc.textContent=descriptions[v];
let meta='<p class="meta">27 НОЯБРЯ　 /　 КОРПОРАТИВНОЕ МЕРОПРИЯТИЕ</p>',list=links(),detail='<h3>'+halls[h]+'</h3><p>'+roles[h]+'</p><hr>'+status(h);
const screens=[meta+'<h2>Паспорт мероприятия</h2><div class="row"><b>№ 027</b>　Монтаж 26.11　·　Прогоны 13:00</div>'+list,
meta+'<h2>Маршрут бригады</h2><p class="meta">ВХОД　↓　ЗАЛЫ</p>'+list+'<hr><p>'+halls[h]+' · '+roles[h]+'</p>',
meta+'<h2>Рабочий разворот</h2><div class="split"><div>'+list+'</div><div class="detail">'+detail+'</div></div>',
meta+'<h2>Передача смены</h2><div class="slots"><div class="slot">Открытые пункты<strong>'+checks.flat().filter(x=>!x).length+'</strong></div><div class="slot">Залы готовы<strong>'+ready.filter(Boolean).length+' / 3</strong></div></div>'+list,
meta+'<div class="tabs">'+list+'</div><hr><div class="big">0'+(h+1)+'</div><h2>'+halls[h]+'</h2>'+roles[h]+'<hr>'+status(h)];
board.innerHTML=screens[v];tech.innerHTML='<p class="meta">'+['ПАСПОРТ　/　ЛИСТ','МАРШРУТ　/　ОСТАНОВКА','БЮРО　/　ЗАЛ','СМЕНА　/　ПОСТ','КАРТОТЕКА　/　ЛИСТ'][v]+' 0'+(h+1)+'</p><h2>'+halls[h]+'</h2><p>'+roles[h]+'</p><hr>'+tasks[h].map((t,i)=>'<label class="task"><input type="checkbox" onchange="change('+i+')" '+(checks[h][i]?'checked':'')+'>'+t+'</label>').join('')+(ready[h]?'<p class="info">✓ Готовность подтверждена</p>':checks[h].every(Boolean)?'<button class="confirm" onclick="confirmHall()">Зал готов</button>':'<p class="info">Осталось пунктов: '+checks[h].filter(x=>!x).length+'</p>')+'<hr><small>Демонстрация · без отправки уведомлений</small>'}
v=Math.max(0,Math.min(4,(Number(location.hash.slice(1))||1)-1));render()
</script></html>
