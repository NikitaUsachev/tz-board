<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адрес площадки · ТЗ</title><style>
*{box-sizing:border-box}body{--paper:#f6f4ee;--ink:#222725;--muted:#565e58;--line:#989e97;--wash:#e9eae3;--ready:#246749;margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}body.dark{--paper:#19201f;--ink:#f0f1eb;--muted:#b7c1bb;--line:#737f77;--wash:#26312e;--ready:#9ddab6}button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}button:focus-visible,input:focus-visible{outline:3px solid #578bbd;outline-offset:2px}header,main,footer{max-width:1260px;margin:auto;padding:18px clamp(15px,4vw,54px)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}small,.kicker,.id,time{font:600 12px/1.55 ui-monospace,monospace;letter-spacing:.06em}.theme{border:1px solid var(--line);padding:7px 12px}.hero{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:30px 0 20px;border-bottom:4px solid}.hero h1{font-size:clamp(36px,6vw,82px);letter-spacing:-.065em;line-height:.98;margin:8px 0}.hero time{white-space:nowrap}.meta{color:var(--muted);margin:8px 0}.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,5vw,84px);margin-top:32px}.room{border-top:1px solid var(--line);width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:start;text-align:left;gap:18px;padding:18px 12px}.room[aria-pressed=true]{background:var(--wash);box-shadow:inset 4px 0 var(--ink)}.id{font-size:20px}.room b{display:block;font-size:clamp(20px,2.7vw,36px);letter-spacing:-.04em;line-height:1.2}.room em{font-style:normal;color:var(--muted)}.arrow{font-size:25px}.detail{border-top:3px solid;padding:16px 0}.detail h2{font-size:36px;letter-spacing:-.05em;margin:5px 0}.task{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0}.task input{width:20px;height:20px;accent-color:var(--ready)}.task:has(:checked){color:var(--muted)}.confirm{background:var(--ink);color:var(--paper);padding:12px 20px}.ok{color:var(--ready);font-weight:700}footer{color:var(--muted);font-size:13px}a{color:inherit}@media(max-width:720px){.layout{grid-template-columns:1fr;gap:20px}.hero{align-items:start;flex-direction:column}.room{padding-block:10px}.hero h1{font-size:42px}.detail{scroll-margin-top:12px}}
</style><header><b>ТЗ на мероприятия</b><button class="theme" id="theme">Тёмная тема</button></header><main><div class="hero"><div><small>LOFT　/　УКАЗАТЕЛЬ ЗАЛОВ</small><h1>Адрес площадки</h1><p class="meta">Корпоративное мероприятие</p></div><time datetime="2026-11-27">27 НОЯБРЯ 2026</time></div><div class="layout"><section><p class="kicker">01—03　 /　 ЗАЛЫ МЕРОПРИЯТИЯ</p><div id="rooms"></div></section><section class="detail" id="detail"><small>СТРАНИЦА ТЕХНИКА</small><div id="sheet"></div></section></div></main><footer>Интерактивный макет · демонстрационные задачи · без отправки уведомлений<br><a href="../">Все эскизы</a></footer><script>
const halls=[['Welcome Hall','Регистрация',['Подключить экран регистрации','Проверить подсветку стойки']],['Main Hall','Пленарная сессия',['Проверить радиомикрофоны','Вывести презентацию']],['Brook Hall','Конференция',['Проверить суфлёр','Вывести изображение на экран']]];
const marks=[[true,true],[false,false],[true,false]],confirmed=[true,false,false];let active=2;
function render(){rooms.innerHTML=halls.map(([name,role],i)=>'<button class="room" aria-pressed="'+(active===i)+'" onclick="selectHall('+i+')"><span class="id">0'+(i+1)+'</span><span><b>'+name+'</b><em>'+role+'</em></span><span class="arrow">↗</span></button>').join('');
let [name,role,tasks]=halls[active],left=marks[active].filter(x=>!x).length;sheet.innerHTML='<h2>'+name+'</h2><p class="meta">'+role+'　/　Зал 0'+(active+1)+'</p><p class="kicker">ЗАДАЧИ　'+(tasks.length-left)+' / '+tasks.length+'</p>'+tasks.map((t,i)=>'<label class="task"><input type="checkbox" onchange="toggleTask('+i+')" '+(marks[active][i]?'checked':'')+'>'+t+'</label>').join('')+(confirmed[active]?'<p class="ok">✓ Готовность подтверждена</p>':left?'<p class="meta">Осталось отметить: '+left+'</p>':'<button class="confirm" onclick="confirmHall()">Зал готов</button>')}
function selectHall(i){active=i;render();if(matchMedia('(max-width:720px)').matches)detail.scrollIntoView()}function toggleTask(i){marks[active][i]=!marks[active][i];confirmed[active]=false;render()}function confirmHall(){if(marks[active].every(Boolean))confirmed[active]=true;render()}theme.onclick=()=>{let dark=document.body.classList.toggle('dark');theme.textContent=dark?'Светлая тема':'Тёмная тема'};render()
</script></html>
