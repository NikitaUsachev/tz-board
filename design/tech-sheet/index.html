<!doctype html><html lang="ru"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Brook Hall · Рабочий лист техника</title><style>*{box-sizing:border-box}body{margin:0;background:#131919;color:#eff3f0;font:16px/1.45 system-ui}main{max-width:860px;margin:auto;padding:20px clamp(16px,4vw,40px) 56px}small,.qty,.status{font:13px/1.5 ui-monospace,monospace}header{border-bottom:4px solid;padding-bottom:18px}h1{font-size:clamp(44px,9vw,82px);letter-spacing:-.06em;line-height:1;margin:22px 0 8px}p{margin:5px 0;color:#b8c3bd}nav{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #76817b;background:none;padding:10px 14px}button[aria-pressed=true],#ready{background:#e9efea;color:#192220}.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:start;gap:12px;border-top:1px solid #53625d;padding:16px 0;cursor:pointer}.row input{width:21px;height:21px;accent-color:#9ad3ad}.row b{font-size:18px}.row small{display:block;color:#9ad3ad}.qty{white-space:nowrap}.section{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--dept);margin-top:20px;padding-top:10px}.section h2{margin:0}.status{border-left:3px solid #819589;padding:8px 14px;margin-top:18px}footer{margin-top:32px;color:#b8c3bd}body:not(.original) h1{font-weight:500}body:not(.original) h2,body:not(.original) .row b{font-weight:500}.weights{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:18px}.weights button{padding:5px 9px;font-size:13px}.weights [aria-pressed=true]{background:#e9efea;color:#192220}body:not(.system-font){font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.faces{margin-bottom:6px}</style><main><div class="weights faces" role="group" aria-label="Шрифт"><small>Шрифт</small> <button data-face="helvetica" aria-pressed="true">Helvetica</button><button data-face="system" aria-pressed="false">Системный</button></div><div class="weights weight-choice" role="group" aria-label="Начертание текста"><small>Насыщенность</small> <button data-bold="0" aria-pressed="true">Легче</button><button data-bold="1" aria-pressed="false">Исходная</button></div><header><small>ТЗ　/　27 НОЯБРЯ　/　СТРАНИЦА ТЕХНИКА</small><h1>Brook Hall</h1><p>Конференция · Корпоративное мероприятие</p><p>Монтаж 26.11　·　Прогоны 13:00</p></header><nav id="filters" aria-label="Мой отдел"></nav><div id="list"></div><div class="status" id="status" aria-live="polite"></div><footer><small>МАКЕТ · Данные демонстрационные. Отметки действуют только на этой странице.</small></footer></main><script>
document.querySelector('.faces').onclick=function(e){const btn=e.target.closest('button');if(!btn)return;document.body.classList.toggle('system-font',btn.dataset.face==='system');this.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))};
document.querySelector('.weight-choice').onclick=function(e){const btn=e.target.closest('button');if(!btn)return;document.body.classList.toggle('original',btn.dataset.bold==='1');this.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))};
const depts=['Сцена','Звук','Свет','Видео'],colors=['#f1acc3','#81cfc3','#e5bd72','#bca7f4'];const rows=[
[0,'Подиум 5 × 3 × 0,2 м','1 шт.','Проверить покрытие и раус.','Никита · 17:44'],
[1,'Радиомикрофон','2 шт.','Проверить оба канала перед прогоном.','Герман · 18:02'],
[2,'Профильный прибор','4 шт.','Проверить фокус на трибуне.','Никита · 18:10'],
[3,'Экран 4,5 × 2,5 м','1 шт.','Собираем на тотемах.',''],
[3,'Суфлёр','2 шт.','Таймер и режим докладчика.','Никита · 18:25'],
[3,'ТВ 65″ на стойке','1 шт.','Дублирующий экран.',''],
[3,'Кликер','1 шт.','Проверить переключение с места спикера.','Герман · 18:32']];
let filter=3,confirmed=false;
function choose(i){filter=i;render()}
function toggle(i,on){rows[i][4]=on?'Вы · сейчас':'';confirmed=false;render()}
function render(){filters.innerHTML=['Все',...depts].map((n,i)=>'<button aria-pressed="'+(filter===i-1)+'" onclick="choose('+(i-1)+')">'+n+'</button>').join('');list.innerHTML=depts.map((d,i)=>{if(filter!==-1&&filter!==i)return '';const items=rows.filter(r=>r[0]===i);return '<div class="section" style="--dept:'+colors[i]+'"><h2>'+d+'</h2><small>'+items.filter(r=>r[4]).length+' / '+items.length+'</small></div>'+items.map(r=>'<label class="row"><input type="checkbox" '+(r[4]?'checked':'')+' onchange="toggle('+rows.indexOf(r)+',this.checked)"><span><b>'+r[1]+'</b><p>'+r[3]+'</p><small>'+r[4]+'</small></span><span class="qty">'+r[2]+'</span></label>').join('')}).join('');const left=rows.filter(r=>!r[4]).length;document.getElementById('status').innerHTML=left?'По всему залу осталось пунктов: '+left:confirmed?'✓ Готовность зала подтверждена':'<button id="ready" onclick="confirmed=true;render()">Зал готов</button>'}render()</script></html>
