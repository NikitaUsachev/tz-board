name: Application regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check app.js
      - name: Tests and coverage (no credentials or live requests)
        run: npm run test:coverage
  browser-checks:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Telegram publication preview and mobile layout
        run: node tests/browser/publication.cjs
      - name: Startup failures and recovery
        run: node tests/browser/startup.cjs
      - name: Block confirmations in Chromium
        run: node tests/browser/block-checks.cjs
      - name: Mobile header in Chromium and WebKit
        run: node tests/browser/mobile-header.cjs
      - name: File cards in Chromium and WebKit
        run: node tests/browser/mobile-files.cjs
      - name: Filled full mobile sheet
        run: node tests/browser/full-sheet.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-checks-mobile
          path: /tmp/block-checks-mobile.png
