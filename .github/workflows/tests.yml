name: Application regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check app.js
      - name: Tests and coverage (no credentials or live requests)
        run: npm run test:coverage
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Block confirmations in Chromium
        run: node tests/browser/block-checks.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-checks-mobile
          path: /tmp/block-checks-mobile.png
